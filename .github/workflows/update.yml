# ------------------------------------------------------------
# Angela Gales
# This code was cleaned up using Claude to comment steps 
# and order the script.
# Runs bilateral.R and update.R automatically and saves the new
# chart and table.
# ------------------------------------------------------------

name: Update chart

on:
  schedule:
    - cron: "0 9 5 * *"   # every month, on the 5th, at 09:00 UTC
  workflow_dispatch:       # also adds a "Run workflow" button

permissions:
  contents: write          # allows GitHub to save the new chart

jobs:
  update:
    runs-on: ubuntu-latest
    steps:

      - name: Get the files from the repo
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install the R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::plotly
            any::htmlwidgets
            any::httr2
            any::jsonlite

      # bilateral.R first, it makes the table update.R puts on the page.
      # If it fails (e.g. a website is down) the chart still updates.
      - name: Run bilateral.R (the table)
        continue-on-error: true
        run: Rscript bilateral.R

      - name: Run update.R (the page)
        run: Rscript update.R

      - name: Save the new chart in the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html lib
          git add bilateral_target_simple.csv bilateral_target_simple_by_source.csv || echo "No table this time"
          git commit -m "Monthly chart update" || echo "Nothing changed"
          git push
